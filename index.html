            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SharmaExpo | Founded by Raj Sharma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raj Sharma">
    <meta name="description" content="SharmaExpo – SMM Panel | Super cheap & super fast">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #3a3a3a, #111);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #f5c400;
        }

        .headline {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin: 20px 0 10px;
            line-height: 1.2;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 25px;
        }

        .login-box {
            background: #2b2b2f;
            border-radius: 8px;
            padding: 25px 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        label {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 6px;
            display: block;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #3a3a3f;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: #f5c400;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #bbb;
        }

        .options a {
            color: #f5c400;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #f5c400;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
        }

        .btn:hover {
            background: #ffda2e;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Sharma<span>Expo</span>
    </div>

    <div class="headline">
        The best SMM panel.<br>
        Super cheap & super fast!
    </div>

    <div class="subtitle">
        Step up your social media game using various SMM services that we offer.
    </div>

    <div class="login-box">
        <form>
            <label>Username</label>
            <input type="text" placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button class="btn" type="submit">Sign in</button>
        </form>
    </div>

    <footer>
        © 2026 SharmaExpo • Founded by Raj Sharma
    </footer>

</div>

</body>
</html>
