<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SharmaExpo | Founded by Raj Sharma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raj Sharma">
    <meta name="description" content="SharmaExpo – A trusted digital services platform founded by Raj Sharma.">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #ffffff;
            width: 360px;
            padding: 35px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 5px;
            color: #333;
        }

        .login-box .subtitle {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #007bff;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .options a {
            text-decoration: none;
            color: #007bff;
        }

        .options a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #ddd;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>SharmaExpo</h2>
        <div class="subtitle">Founded by Raj Sharma</div>

        <form action="#" method="post">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot?</a>
            </div>

            <button type="submit">Sign In</button>
        </form>
    </div>

    <footer>
        © 2026 SharmaExpo. All Rights Reserved.<br>
        Founded by Raj Sharma
    </footer>

</body>
</html>
