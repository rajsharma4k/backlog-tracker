
          <!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Online Tic Tac Toe</title>
  <style>
    body { font-family: Arial; text-align: center; background: #111; color: #fff; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; margin: 30px auto; }
    .cell {
      width: 100px; height: 100px;
      background: #222; font-size: 48px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 10px;
    }
    .cell:hover { background: #333; }
    #status { margin-top: 20px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Online Tic Tac Toe</h1>
  <div class="board" id="board"></div>
  <div id="status">Waiting for opponent...</div>  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>  <script>
    const socket = io();
    const board = document.getElementById('board');
    const status = document.getElementById('status');
    let symbol = '';

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.addEventListener('click', () => {
        if (!cell.textContent && symbol) {
          socket.emit('move', i);
        }
      });
      board.appendChild(cell);
    }

    socket.on('symbol', s => {
      symbol = s;
      status.textContent = `You are ${symbol}`;
    });

    socket.on('update', data => {
      board.children[data.index].textContent = data.symbol;
    });

    socket.on('message', msg => status.textContent = msg);
  </script></body>
          </html>
